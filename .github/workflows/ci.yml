name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Unlike the default shell, this one fails a step when any command in a pipe fails.
    shell: bash

env:
  NODE_VERSION: "24"
  RUFF_VERSION: "0.16.9"
  SWIFTFORMAT_VERSION: "0.63.0"
  SWIFTFORMAT_SHA256: b4a3cbb8c852a0baaf9adf853e221ff1dabf921a3d8957a602e0bda3af8470f1

jobs:
  format:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install SwiftFormat and Ruff
        run: |
          archive="$RUNNER_TEMP/swiftformat.zip"
          curl -fsSL -o "$archive" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat_linux.zip"
          echo "$SWIFTFORMAT_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/swiftformat"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$RUNNER_TEMP/swiftformat/swiftformat_linux" "$RUNNER_TEMP/bin/swiftformat"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          pipx install "ruff==$RUFF_VERSION"
      - name: Check formatting (fix with scripts/format.sh)
        run: scripts/format.sh --check

  fixtures:
    name: Fixtures match near-api-js
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Regenerate the fixtures
        run: scripts/regenerate-fixtures.sh
      - name: Compare with the committed fixtures
        run: git diff --exit-code -- Tests/NearSignerCoreTests/Fixtures.swift host/python/test_fixtures.json

  # Swift unit tests, the Python host against near-signer-sim, and near-connect's Ledger executor
  # over emulated BLE: everything scripts/test-all.sh runs. On Linux the core signs with
  # swift-crypto, on macOS with CryptoKit.
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        run: |
          if ! command -v python3 > /dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends python3
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-linux-swift6.3-${{ hashFiles('Package.swift') }}
      - run: swift --version
      - run: scripts/test-all.sh

  test-macos:
    name: Test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: swift --version
      - run: scripts/test-all.sh

  ios:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -version
      # Debug, with the bridge that lets the Mac talk to the app in the Simulator.
      - name: Build for the iOS Simulator
        run: >
          xcodebuild build -project iOS/NearSigner.xcodeproj -scheme NearSigner -configuration Debug
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
          | xcbeautify --renderer github-actions
      # Release, as installed on a phone. Signing needs the developer's own team, so it is skipped.
      - name: Build for iPhone (unsigned)
        run: >
          xcodebuild build -project iOS/NearSigner.xcodeproj -scheme NearSigner -configuration Release
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
          | xcbeautify --renderer github-actions
