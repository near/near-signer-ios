name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Unlike the default shell, this one fails a step when any command in a pipe fails.
    shell: bash

env:
  NODE_VERSION: "24"
  RUFF_VERSION: "0.16.9"
  SWIFTFORMAT_VERSION: "0.63.0"
  SWIFTFORMAT_SHA256: b4a3cbb8c852a0baaf9adf853e221ff1dabf921a3d8957a602e0bda3af8470f1

jobs:
  format:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install SwiftFormat and Ruff
        run: |
          archive="$RUNNER_TEMP/swiftformat.zip"
          curl -fsSL -o "$archive" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat_linux.zip"
          echo "$SWIFTFORMAT_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/swiftformat"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 "$RUNNER_TEMP/swiftformat/swiftformat_linux" "$RUNNER_TEMP/bin/swiftformat"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          pipx install "ruff==$RUFF_VERSION"
      - name: Check formatting (fix with scripts/format.sh)
        run: scripts/format.sh --check

  fixtures:
    name: Fixtures match near-api-js
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Regenerate the fixtures
        run: scripts/regenerate-fixtures.sh
      - name: Compare with the committed fixtures
        run: git diff --exit-code -- Tests/NearSignerCoreTests/Fixtures.swift host/python/test_fixtures.json

  # The camera transfer's JavaScript (host/optical): the codec and CLI, the browser page and the
  # near-connect executor. Lint, unit tests, and the committed executor bundle must match a
  # fresh build. The browser tests stay manual (they need Chromium and testnet).
  javascript:
    name: Camera-transfer JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: host/optical
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: host/optical/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Rebuild the executor bundle and the camera page
        run: npm run build
      - name: Compare with the committed files
        run: git diff --exit-code -- near-signer-qr-executor.js near-signer-qr-camera.html

  # The Rust crate for near-cli-rs (host/rust/near-signer-qr): the third implementation of the
  # camera transfer, published to crates.io. The runner's own Rust toolchain; the pipe checks it
  # against the JavaScript sender frame for frame.
  rust:
    name: Rust camera-transfer crate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      MANIFEST: host/rust/near-signer-qr/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            host/rust/near-signer-qr/target
          key: cargo-${{ hashFiles('host/rust/near-signer-qr/Cargo.lock') }}
      - run: cargo --version
      - run: cargo fmt --check --manifest-path "$MANIFEST"
      - run: cargo clippy --all-targets --manifest-path "$MANIFEST" -- -D warnings
      - run: cargo test --manifest-path "$MANIFEST"
      - name: Package as for crates.io
        run: cargo publish --dry-run --manifest-path "$MANIFEST"
      - name: Build on the minimum Rust (rust-version in Cargo.toml)
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' "$MANIFEST")"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --all-targets --manifest-path "$MANIFEST"
      - name: Node sender -> Rust receiver
        run: |
          tx="DQAAAGFsaWNlLnRlc3RuZXQAxXHjPi42wsco1hfqd6iOIyDIaX6si0Y638ASi5aCXL8HAAAAAAAAAAsAAABib2IudGVzdG5ldDlKvrNecHYJ3o9ztj1DvRo3b/5nk1yqaJN90pvATmc8AQAAAAMAAIBxZDO2KaM9AQAAAAAA"
          node host/optical/near-signer-qr.mjs sign-tx --tx "$tx" --frames-out 60 --loss 0.3 --shuffle --session-id 0badcafe --seed 7 \
            | cargo run --quiet --manifest-path "$MANIFEST" -- receive | tee received.json
          grep -q "\"path\": \"m/44'/397'/0'/0'/1'\"" received.json
          grep -q "\"payload\": \"$tx\"" received.json
      - name: Rust sender -> Node receiver (frames are identical)
        # Uncompressed: the two DEFLATE implementations may pack the same bytes differently.
        run: |
          tx="DQAAAGFsaWNlLnRlc3RuZXQAxXHjPi42wsco1hfqd6iOIyDIaX6si0Y638ASi5aCXL8HAAAAAAAAAAsAAABib2IudGVzdG5ldDlKvrNecHYJ3o9ztj1DvRo3b/5nk1yqaJN90pvATmc8AQAAAAMAAIBxZDO2KaM9AQAAAAAA"
          diff <(cargo run --quiet --manifest-path "$MANIFEST" -- sign-tx --tx "$tx" --no-compress --frames-out 30 --session-id 0badcafe --fragment-size 50) \
               <(node host/optical/near-signer-qr.mjs sign-tx --tx "$tx" --no-compress --frames-out 30 --session-id 0badcafe --fragment-size 50)

  # Swift unit tests, the Python host against near-signer-sim, and near-connect's Ledger executor
  # over emulated BLE: everything scripts/test-all.sh runs. On Linux the core signs with
  # swift-crypto, on macOS with CryptoKit.
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        run: |
          if ! command -v python3 > /dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends python3
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-linux-swift6.3-${{ hashFiles('Package.swift') }}
      - run: swift --version
      - run: scripts/test-all.sh

  test-macos:
    name: Test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: swift --version
      - run: scripts/test-all.sh

  ios:
    name: Build iOS app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -version
      # Debug, with the bridge that lets the Mac talk to the app in the Simulator.
      - name: Build for the iOS Simulator
        run: >
          xcodebuild build -project iOS/NearSigner.xcodeproj -scheme NearSigner -configuration Debug
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
          | xcbeautify --renderer github-actions
      # Release, as installed on a phone. Signing needs the developer's own team, so it is skipped.
      - name: Build for iPhone (unsigned)
        run: >
          xcodebuild build -project iOS/NearSigner.xcodeproj -scheme NearSigner -configuration Release
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
          | xcbeautify --renderer github-actions
