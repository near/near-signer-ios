# Fallback project definition. If NearSigner.xcodeproj does not open in your Xcode version:
#   brew install xcodegen && cd iOS && xcodegen generate
name: NearSigner
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  NearSignerCore:
    path: ..
targets:
  NearSigner:
    type: application
    platform: iOS
    sources:
      - path: NearSigner
    dependencies:
      - package: NearSignerCore
        product: NearSignerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.near-signer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: NEAR Signer
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: NEAR Signer receives transactions to sign from your computer over Bluetooth.
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID protects your NEAR key: every signature requires it."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
